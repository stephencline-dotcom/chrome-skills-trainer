<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Skills Trainer - Classroom Presentation</title>

  <!-- Stylesheets: reuse the same simulated desktop/browser visual language as Student Practice -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/desktop.css">
  <link rel="stylesheet" href="styles/browser.css">
  <link rel="stylesheet" href="styles/lesson-player.css">
  <link rel="stylesheet" href="styles/presentation.css">
</head>
<body class="presentation-body">

  <div id="presentation-root">

    <!-- Large classroom-facing header: title, explanation, step indicator, local mode badge -->
    <header id="presentation-header">
      <div class="presentation-header-top">
        <span class="presentation-badge" title="This tab only follows a Teacher Control tab open in the same browser">
          Local Presentation Mode
        </span>
        <div class="presentation-header-actions">
          <span id="presentation-step-indicator" class="presentation-step-indicator">Step 1 of 1</span>
          <nav class="presentation-step-nav" aria-label="Presentation lesson navigation">
            <button type="button" id="presentation-prev-btn" class="presentation-step-nav-btn">
              &larr; Previous
            </button>
            <button type="button" id="presentation-next-btn" class="presentation-step-nav-btn">
              Next &rarr;
            </button>
          </nav>
        </div>
      </div>
      <h1 id="presentation-lesson-title" class="presentation-lesson-title">Loading Lesson&hellip;</h1>
      <p id="presentation-explanation" class="presentation-explanation"></p>
      <p id="presentation-sync-status" class="presentation-sync-status" aria-live="polite">Connecting to Teacher Control&hellip;</p>
    </header>

    <!-- Simulated Desktop Workspace -->
    <main id="presentation-workspace" aria-label="Simulated Windows Desktop (Classroom Presentation)">

      <!-- Step 1: Prominent Minimize symbol callout -->
      <div id="presentation-symbol-badge" class="presentation-symbol-badge" style="display: none;" aria-hidden="true">
        <span class="presentation-symbol-icon">&#10134;</span>
        <span class="presentation-symbol-caption">The Minimize Symbol</span>
      </div>

      <!-- Step 3: Caption for the shared cursor demonstration -->
      <p id="presentation-demo-caption" class="demo-caption presentation-demo-caption" aria-live="polite"></p>

      <!-- Step 7: Non-interactive Minimize vs Close discussion cards -->
      <div id="presentation-quiz-display" class="presentation-quiz-display" style="display: none;" aria-label="Minimize or Close discussion">
        <div class="presentation-quiz-option">
          <span class="presentation-quiz-icon">&#10134;</span>
          <span>Minimize</span>
        </div>
        <div class="presentation-quiz-option">
          <span class="presentation-quiz-icon">&#10060;</span>
          <span>Close</span>
        </div>
      </div>

      <!-- Step 8: Lesson completion celebration -->
      <div id="presentation-celebration" class="presentation-celebration" style="display: none;">
        <h2>&#127881; Lesson Complete!</h2>
        <p id="presentation-celebration-text">Minimize hides a window without closing it.</p>
      </div>

      <!-- Simulated Chrome Window (mirrors Student Practice markup/ids for shared CSS) -->
      <div id="chrome-window" role="application" aria-label="Interactive simulated Chrome window" tabindex="0">

        <header id="window-titlebar">
          <div class="chrome-tabstrip">
            <div class="chrome-tab" title="Chrome Skills Trainer">
              <svg class="chrome-tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="10" fill="#4285f4"/>
                <circle cx="12" cy="12" r="4" fill="#ffffff"/>
              </svg>
              <span class="chrome-tab-title">Chrome Skills Trainer</span>
            </div>
          </div>

          <!-- Window Controls: noninteractive on the projected page -->
          <div class="window-controls" aria-label="Window Controls (Display Only)">
            <button type="button" id="btn-minimize" class="win-btn win-btn-minimize" data-simulator-control="minimize">
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <line x1="3" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1.2"/>
              </svg>
            </button>

            <button type="button" id="btn-maximize" class="win-btn win-btn-maximize" data-simulator-control="maximize">
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <rect x="3.5" y="3.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2"/>
              </svg>
            </button>

            <button type="button" id="btn-close" class="win-btn win-btn-close" data-simulator-control="close">
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <line x1="4" y1="4" x2="12" y2="12" stroke="currentColor" stroke-width="1.2"/>
                <line x1="12" y1="4" x2="4" y2="12" stroke="currentColor" stroke-width="1.2"/>
              </svg>
            </button>
          </div>
        </header>

        <div class="chrome-toolbar">
          <button type="button" id="btn-back" class="nav-btn" data-simulator-control="back" aria-label="Back" title="Back">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
          </button>

          <button type="button" id="btn-forward" class="nav-btn" data-simulator-control="forward" aria-label="Forward" title="Forward">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8-8-8z"/>
            </svg>
          </button>

          <div class="chrome-address-bar" aria-hidden="true">
            <svg class="address-lock-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            <span id="browser-address" class="address-text">https://chrome-skills-trainer.local/home</span>
          </div>
        </div>

        <section id="browser-content" class="chrome-content" aria-label="Simulated Browser Page">
          <div class="chrome-logo-area">
            <h1 class="chrome-logo-text">
              <span class="chrome-logo-blue">C</span><span class="chrome-logo-red">h</span><span class="chrome-logo-yellow">r</span><span class="chrome-logo-blue">o</span><span class="chrome-logo-green">m</span><span class="chrome-logo-red">e</span>
              <span style="font-weight: 300; color: #5f6368; font-size: 1.8rem; margin-left: 8px;">Trainer</span>
            </h1>
          </div>
        </section>

      </div>
    </main>

    <!-- Simulated Windows Taskbar -->
    <footer id="taskbar" aria-label="Simulated Windows Taskbar (Display Only)">
      <div class="taskbar-left">
        <button type="button" class="taskbar-start-btn">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="#ffffff" aria-hidden="true" focusable="false">
            <path d="M0 2.5L6.5 1.6V7.5H0V2.5ZM0 8.5H6.5V14.4L0 13.5V8.5ZM7.5 1.45L16 0.2V7.5H7.5V1.45ZM7.5 8.5H16V15.8L7.5 14.55V8.5Z"/>
          </svg>
        </button>

        <div class="taskbar-apps">
          <button type="button" id="taskbar-chrome-btn" class="taskbar-app-btn is-active" data-simulator-control="chrome-taskbar">
            <div class="taskbar-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="10" fill="#4285f4"/>
                <circle cx="12" cy="12" r="4" fill="#ffffff"/>
              </svg>
            </div>
            <span class="taskbar-label">Chrome Skills Trainer</span>
          </button>
        </div>
      </div>

      <div class="taskbar-right"></div>
    </footer>

  </div>

  <script type="module" src="scripts/presentation.js"></script>
</body>
</html>
